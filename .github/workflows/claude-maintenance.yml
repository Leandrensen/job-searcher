name: Claude Maintenance
on:
  schedule:
    - cron: "7 6 * * *" # every night at 03:07 Buenos Aires time (06:07 UTC)
  workflow_dispatch: # run manually from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  maintain:
    uses: ./.github/workflows/claude-worker.yml
    secrets: inherit
    with:
      name: maintenance
      task: |
        Scan for correctness bugs, and for core logic, adapters or DB code that
        is missing unit or integration tests. Pick the SINGLE most valuable
        issue and fix it test-first. Use a `fix/` branch for bugs and a `test/`
        branch for missing tests.
